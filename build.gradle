plugins {
    id 'application'
    id 'java'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'seedu.eventmanager'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.postgresql:postgresql:42.7.13'
    implementation 'org.flywaydb:flyway-core:11.11.2'
    implementation 'org.flywaydb:flyway-database-postgresql:11.11.2'
    implementation 'io.github.cdimascio:dotenv-java:3.2.0'

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'seedu.eventmanager.Main'
    applicationDefaultJvmArgs = ['--enable-native-access=javafx.graphics']
}

javafx {
    version = '25'
    modules = ['javafx.controls']
}

tasks.named('test') {
    useJUnitPlatform()
}

// Opt-in demo data for testers: accounts, clubs, venues, events and registrations in the .env database.
tasks.register('seedDemo', JavaExec) {
    group = 'application'
    description = 'Loads demo data into the database configured in .env (skipped if already loaded).'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'seedu.eventmanager.demo.DemoDataSeeder'
    workingDir = rootDir
}

// Release packaging: one runnable jar for Windows, Linux and macOS. JavaFX native libraries have
// different file names per OS (.dll, .so, .dylib), so all three can live in one jar. Intel and Apple
// Silicon macOS natives share names, so only Apple Silicon (mac-aarch64) is bundled.
def javafxPlatforms = ['win', 'linux', 'mac-aarch64']
// One configuration per platform: Gradle rejects two platform variants of a module in one configuration.
def javafxJars = files()
javafxPlatforms.each { platform ->
    def configuration = configurations.create("javafx_${platform.replace('-', '_')}")
    ['base', 'graphics', 'controls'].each { module ->
        dependencies.add(configuration.name, "org.openjfx:javafx-${module}:${javafx.version}:${platform}@jar")
    }
    javafxJars = javafxJars + configuration
}
def runtimeJars = configurations.runtimeClasspath
def mergedServices = layout.buildDirectory.dir('merged-services')

// Flyway finds its PostgreSQL support through META-INF/services files that several jars share;
// merge them so the fat jar keeps every entry instead of only the first copy.
tasks.register('mergeServiceFiles') {
    inputs.files(runtimeJars)
    outputs.dir(mergedServices)
    doLast {
        File out = mergedServices.get().asFile
        out.deleteDir()
        Map<String, Set<String>> merged = [:]
        runtimeJars.files.findAll { it.name.endsWith('.jar') }.each { jar ->
            new java.util.zip.ZipFile(jar).withCloseable { zip ->
                zip.entries().findAll { !it.directory && it.name.startsWith('META-INF/services/') }.each { entry ->
                    Set<String> lines = merged.computeIfAbsent(entry.name) { new LinkedHashSet<String>() }
                    zip.getInputStream(entry).getText('UTF-8').readLines()*.trim()
                            .findAll { it && !it.startsWith('#') }.each { lines << it }
                }
            }
        }
        merged.each { name, lines ->
            File file = new File(out, name)
            file.parentFile.mkdirs()
            file.setText(lines.join('\n') + '\n', 'UTF-8')
        }
    }
}

tasks.register('releaseJar', Jar) {
    group = 'distribution'
    description = 'Builds one runnable jar with all dependencies and JavaFX for Windows, Linux and macOS.'
    dependsOn 'mergeServiceFiles', 'classes'
    archiveBaseName = 'EventVenueManager'
    destinationDirectory = layout.buildDirectory.dir('release')
    manifest {
        attributes('Main-Class': 'seedu.eventmanager.Main',
                'Implementation-Version': project.version,
                'Enable-Native-Access': 'ALL-UNNAMED')
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(mergedServices)
    from(sourceSets.main.output)
    from({ (runtimeJars + javafxJars).filter { it.name.endsWith('.jar') }.collect { zipTree(it) } }) {
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/*.EC',
                'module-info.class', 'META-INF/versions/*/module-info.class'
    }
}

// Opt-in: requires a graphical desktop. Uses synthetic service fixtures, not a live database.
tasks.register('attendeeUiSmoke', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'seedu.eventmanager.ui.AttendeeBrowseSmoke'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

// Opt-in real JavaFX command flow with synthetic service callbacks; not database E2E.
tasks.register('attendeeRegistrationUiSmoke', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'seedu.eventmanager.ui.AttendeeRegistrationSmoke'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
