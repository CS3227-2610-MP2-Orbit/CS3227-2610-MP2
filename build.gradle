plugins {
    id 'application'
    id 'java'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'seedu.eventmanager'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.postgresql:postgresql:42.7.13'
    implementation 'org.flywaydb:flyway-core:11.11.2'
    implementation 'org.flywaydb:flyway-database-postgresql:11.11.2'
    implementation 'io.github.cdimascio:dotenv-java:3.2.0'

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'seedu.eventmanager.Main'
    applicationDefaultJvmArgs = ['--enable-native-access=javafx.graphics']
}

javafx {
    version = '25'
    modules = ['javafx.controls']
}

tasks.named('test') {
    useJUnitPlatform()
}

// Opt-in: requires a graphical desktop. Uses synthetic service fixtures, not a live database.
tasks.register('attendeeUiSmoke', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'seedu.eventmanager.ui.AttendeeBrowseSmoke'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}
