name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/CS3227
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_INTEGRATION_TESTS: 'true'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: CS3227
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d CS3227"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # No formatter/checkstyle/PMD/SpotBugs plugin exists yet. Compilation is
      # the currently applicable type/static check and must pass before tests.
      - name: Compile and static/type check
        run: ./gradlew compileJava

      - name: Lint check
        run: |
          if grep -Eq "(checkstyle|pmd|spotbugs|spotless|errorprone)" build.gradle; then
            ./gradlew checkstyleMain pmdMain spotbugsMain spotlessCheck
          else
            echo "No lint plugin is configured; compileJava is the applicable static check."
          fi

      - name: Unit tests
        run: ./gradlew test --tests 'seedu.eventmanager.common.*' --tests 'seedu.eventmanager.venue.*' --tests 'seedu.eventmanager.service.*' --tests 'seedu.eventmanager.MainTest'

      - name: Integration tests
        run: ./gradlew test --tests 'seedu.eventmanager.integration.*'

      - name: E2E tests
        run: ./gradlew test --tests 'seedu.eventmanager.e2e.*'

      - name: Production build
        run: ./gradlew build
