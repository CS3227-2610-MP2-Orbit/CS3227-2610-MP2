name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/CS3227
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_INTEGRATION_TESTS: 'true'
      # Database-gated tests skip themselves when these are missing, and a skipped
      # test still leaves the step green. Setting them for the whole job means every
      # test step runs them; -PfailOnSkippedTests turns any remaining skip into a failure.
      EVENT_MANAGER_TEST_DB_URL: jdbc:postgresql://localhost:5432/CS3227
      EVENT_MANAGER_TEST_DB_USER: postgres
      EVENT_MANAGER_TEST_DB_PASSWORD: postgres
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: CS3227
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d CS3227"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update -y && sudo apt-get install -y postgresql-client

      - name: Reset PostgreSQL test database
        run: |
          export PGPASSWORD=postgres
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "DROP DATABASE IF EXISTS \"CS3227\";"
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE \"CS3227\";"

      - name: Compile and type check
        run: ./gradlew compileJava compileTestJava

      # Checkstyle runs the config in config/checkstyle. Both source sets are
      # errors, not warnings, so a violation fails the build.
      - name: Lint check
        run: ./gradlew checkstyleMain checkstyleTest

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-report
          path: build/reports/checkstyle/

      - name: Unit tests
        run: ./gradlew test -PfailOnSkippedTests --tests 'seedu.eventmanager.common.*' --tests 'seedu.eventmanager.venue.*' --tests 'seedu.eventmanager.service.*' --tests 'seedu.eventmanager.notification.*' --tests 'seedu.eventmanager.MainTest'

      - name: Integration tests
        run: |
          ./reset-ci-database.sh
          ./gradlew test -PfailOnSkippedTests --tests 'seedu.eventmanager.integration.*'

      # Organizer database tests truncate their tables, so they get a clean database.
      # Without this step they only ran inside the final build, where they skipped.
      - name: Organizer tests
        run: |
          ./reset-ci-database.sh
          ./gradlew test -PfailOnSkippedTests --tests 'seedu.eventmanager.event.*' --tests 'seedu.eventmanager.club.*' --tests 'seedu.eventmanager.volunteer.*' --tests 'seedu.eventmanager.announcement.*' --tests 'seedu.eventmanager.storage.*'

      - name: Attendee catalogue tests
        run: |
          ./reset-ci-database.sh
          ./gradlew test -PfailOnSkippedTests --tests 'seedu.eventmanager.attendee.*' --tests 'seedu.eventmanager.ui.*'

      - name: E2E tests
        run: |
          ./reset-ci-database.sh
          ./gradlew test -PfailOnSkippedTests --tests 'seedu.eventmanager.e2e.*'

      - name: Registration contract and workflow tests
        run: |
          ./reset-ci-database.sh
          ./gradlew test -PfailOnSkippedTests --tests 'seedu.eventmanager.registration.*'

      - name: Production build
        run: |
          ./reset-ci-database.sh
          ./gradlew build -PfailOnSkippedTests

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
