name: Release

# Continuous delivery for the single cross-platform jar.
# - Pull requests that touch the app or build: build the jar and check that it starts JavaFX on
#   Linux, Windows and macOS. Nothing is published.
# - Publish a release in either of two ways:
#   1. Actions tab -> Release -> Run workflow, enter a version such as v1.0.0 (the tag is created
#      on the selected branch), or
#   2. git tag v1.0.0 && git push origin v1.0.0
on:
  pull_request:
    paths:
      - 'build.gradle'
      - 'src/main/**'
      - '.github/workflows/release.yml'
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to create, for example v1.0.0'
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build jar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      # Database suites skip without EVENT_MANAGER_TEST_DB_URL; the CI workflow runs them against PostgreSQL.
      - name: Unit tests and release jar
        run: ./gradlew test releaseJar
      - uses: actions/upload-artifact@v4
        with:
          name: release-jar
          path: build/release/*.jar
          if-no-files-found: error

  verify:
    name: Starts on ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-jar
          path: dist
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Version check
        shell: bash
        run: java -jar dist/EventVenueManager-*.jar --version
      - name: JavaFX native libraries load (Linux, virtual display)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y && sudo apt-get install -y xvfb libgtk-3-0
          xvfb-run -a java -jar dist/EventVenueManager-*.jar --check-javafx
      - name: JavaFX native libraries load
        if: runner.os != 'Linux'
        shell: bash
        run: java -jar dist/EventVenueManager-*.jar --check-javafx

  publish:
    name: Publish GitHub Release
    needs: verify
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-jar
          path: dist
      - name: Checksum and configuration template
        run: |
          cp .env.example dist/env.example
          cd dist && sha256sum -- *.jar > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must look like v1.0.0, got: $TAG" >&2
            exit 1
          fi
          if [[ ! -f "dist/EventVenueManager-${TAG#v}.jar" ]]; then
            echo "Tag $TAG does not match the jar version (set version in build.gradle first):" >&2
            ls dist >&2
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Event Venue Manager $TAG" --generate-notes \
              --notes "One jar for Windows, Linux and Apple Silicon macOS. Save env.example as .env next to the jar. Requires Java 25 and PostgreSQL; see the User Guide."
          fi
